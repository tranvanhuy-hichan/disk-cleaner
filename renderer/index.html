<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disk Cleaner</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="hero">
    <div class="brand"><img src="logo.svg" alt=""><span>Disk Cleaner</span>
      <button id="settingsBtn" class="icon" type="button" title="Cài đặt" aria-label="Cài đặt">⚙</button>
    </div>

    <div id="ringWrap" class="idle">
      <span class="ripple"></span><span class="ripple r2"></span>
      <svg id="ring" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="gClean" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
          <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="120" cy="120" r="100"/>
        <circle id="arcUsed" class="arc used" cx="120" cy="120" r="100"/>
        <circle id="arcClean" class="arc clean" cx="120" cy="120" r="100"/>
        <g class="sweep"><circle cx="120" cy="120" r="100" stroke="url(#gSweep)"/></g>
      </svg>
      <div class="center">
        <div id="cLabel" class="c-label">Đã dùng</div>
        <div class="c-num"><span id="cNum">0</span><span id="cUnit">%</span></div>
        <div id="cSub" class="c-sub"></div>
      </div>
    </div>

    <div id="diskLine" class="disk-line"></div>

    <div id="legend"></div>
    <div id="stats" class="stats"></div>

    <div class="cta">
      <button id="mainBtn" class="big">Quét máy</button>
      <button id="cancelBtn" type="button" class="ghost" hidden>Huỷ quét</button>
      <div class="mini">
        <button id="selSafe" type="button" hidden>Chọn mục an toàn</button>
        <button id="selNone" type="button" hidden>Bỏ chọn</button>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <h2 id="title">Kết quả quét</h2>
      <div id="tabs" role="tablist">
        <button type="button" class="tab on" data-v="list" role="tab">Danh sách</button>
        <button type="button" class="tab" data-v="tree" role="tab">Dung lượng thư mục</button>
      </div>
      <div id="status">Bấm "Quét máy" để tìm rác. Công cụ chỉ quét, chưa xoá gì.</div>
    </header>
    <div id="toolbar" hidden>
      <input id="search" type="search" placeholder="Tìm theo tên hoặc đường dẫn…  (Ctrl+F)" aria-label="Tìm kiếm">
      <div id="chips" role="group" aria-label="Lọc theo mức độ">
        <button type="button" data-f="all" class="chip on">Tất cả</button>
        <button type="button" data-f="safe" class="chip">An toàn</button>
        <button type="button" data-f="review" class="chip">Xem lại</button>
      </div>
      <button id="exportBtn" type="button" class="ghost sm" title="Xuất danh sách đang hiển thị ra file CSV">Xuất CSV</button>
      <select id="sort" aria-label="Sắp xếp">
        <option value="size">Lớn nhất trước</option>
        <option value="name">Theo tên</option>
      </select>
    </div>
    <section id="list"></section>
    <section id="treeView" hidden>
      <div id="crumbs"></div>
      <div id="treemap"></div>
      <div id="treeHint">Bấm vào ô thư mục để xem bên trong. Chuột phải để mở trong trình quản lý tệp.</div>
    </section>
  </main>

  <dialog id="confirm">
    <form method="dialog">
      <h3>Xác nhận dọn</h3>
      <p id="confirmText"></p>
      <ul id="confirmList"></ul>
      <p id="confirmNote" class="muted"></p>
      <div class="row">
        <button value="cancel">Huỷ</button>
        <button value="ok" class="danger">Xoá</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h3>Cài đặt</h3>
      <label class="opt"><input type="checkbox" id="oTrash"> <span>Tệp lớn: chuyển vào thùng rác thay vì xoá vĩnh viễn<small>Dung lượng chỉ được trả lại sau khi bạn dọn thùng rác. Cache và thư mục build luôn xoá hẳn vì tạo lại được.</small></span></label>
      <label class="opt"><input type="checkbox" id="oLarge"> <span>Tìm tệp lớn trong thư mục home</span></label>
      <label class="opt"><input type="checkbox" id="oDup"> <span>Tìm tệp trùng lặp<small>So theo kích thước, rồi hash nội dung. Luôn giữ lại bản cũ nhất.</small></span></label>
      <label class="opt"><input type="checkbox" id="oBg"> <span>Chạy nền ở khay hệ thống, nhắc dọn định kỳ<small>Đóng cửa sổ chỉ ẩn xuống khay, tự khởi động cùng máy (bản AppImage). Trên GNOME cần tiện ích AppIndicator để thấy biểu tượng khay.</small></span></label>
      <div class="fields">
        <label>Bỏ qua mục nhỏ hơn <input type="number" id="oMin" min="1" max="1000"> MB</label>
        <label>Tệp lớn từ <input type="number" id="oLargeMB" min="50" max="10000"> MB</label>
        <label>Tệp trùng từ <input type="number" id="oDupMB" min="1" max="10000"> MB</label>
        <label>Nhắc sau <input type="number" id="oRemind" min="0" max="90"> ngày (0 = tắt)</label>
      </div>
      <div id="ignoredBox"></div>
      <div class="row">
        <button value="cancel">Đóng</button>
        <button value="ok" class="primary">Lưu</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
